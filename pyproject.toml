[project]
name = "mlx-vlm-kit"
version = "0.1.0"
description = "Mac 本地看图理解引擎 — Qwen3-VL (MLX)，免费、离线、可问任何问题"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "webkubor", email = "webkubor@163.com" }]
keywords = ["vlm", "mlx", "apple-silicon", "vision", "local"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mlx>=0.32",
    "mlx-vlm>=0.7",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# 想让输出念出来？自己接下游（say / voxflow / edge-tts），本包不塞 TTS

[project.scripts]
vlm = "vlmkit.cli:main"

[tool.uv]
# 模型权重不进包，放 ~/.cache/mlx-vlm-kit/（首次用时 hf download）

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vlmkit"]
